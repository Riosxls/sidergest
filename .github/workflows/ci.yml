name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      EBT_TEST_PG: Host=localhost;Username=postgres;Password=postgres
      EBT_TEST_LOG: Error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Ebt.sln
      - run: dotnet build Ebt.sln -c Release --no-restore
        env:
          CI: "true"
      - run: dotnet test Ebt.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: Vulnerable packages
        run: |
          dotnet list Ebt.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -qE "^\s+>" vuln.txt

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
