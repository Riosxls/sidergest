version: 2
# Monthly, and no major-version bumps for .NET packages or base images: the projects target net8.0, so a
# major bump (EF Core 9, .NET 10 images, ...) is done on purpose together with a framework upgrade.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pub
    directory: /clients/flutter
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
