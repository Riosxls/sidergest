name: metagest

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    restart: unless-stopped
    logging: *logging
    mem_limit: ${EBT_DB_MEM:-1g}
    environment:
      POSTGRES_DB: ebt
      POSTGRES_USER: ebt
      POSTGRES_PASSWORD: ${EBT_DB_PASSWORD:?set EBT_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${EBT_DB_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebt -d ebt"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    logging: *logging
    mem_limit: ${EBT_API_MEM:-512m}
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Ebt: Host=db;Database=ebt;Username=ebt;Password=${EBT_DB_PASSWORD:?set EBT_DB_PASSWORD in .env};Maximum Pool Size=${EBT_DB_POOL:-40}
      Jwt__SigningKey: ${EBT_JWT_KEY:?set EBT_JWT_KEY in .env}
      Database__MigrateOnStartup: "true"
      Bootstrap__AdminUser: ${EBT_ADMIN_USER:-admin}
      Bootstrap__AdminPassword: ${EBT_ADMIN_PASSWORD:?set EBT_ADMIN_PASSWORD in .env}
      Swagger__Enabled: ${EBT_SWAGGER:-false}
      Cors__Origins__0: ${EBT_CORS_ORIGIN:-http://localhost:8081}
      AllowedHosts: ${EBT_ALLOWED_HOSTS:-localhost}
      Proxy__Trusted: ${EBT_BEHIND_PROXY:-false}
      Backup__Directory: /backup-status
      Security__MaxIdleMinutes: ${EBT_MAX_IDLE_MINUTES:-0}
      Mail__Host: ${EBT_SMTP_HOST:-}
      Mail__Port: ${EBT_SMTP_PORT:-587}
      Mail__User: ${EBT_SMTP_USER:-}
      Mail__Password: ${EBT_SMTP_PASSWORD:-}
      Mail__From: ${EBT_SMTP_FROM:-}
      Mail__FromName: ${EBT_SMTP_FROM_NAME:-EBT}
      Mail__Security: ${EBT_SMTP_SECURITY:-Auto}
      Alerts__To: ${EBT_ALERT_TO:-}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./backup-status:/backup-status:ro
    ports:
      - "127.0.0.1:${EBT_API_PORT:-8080}:8080"

  # Optional TLS front door and web app host: docker compose --profile proxy up -d caddy (see docs/OPERATIONS.md, "Reverse proxy and web app").
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
    environment:
      EBT_PUBLIC_HOST: ${EBT_PUBLIC_HOST:-localhost}
      EBT_CADDY_TLS: ${EBT_CADDY_TLS:-internal}
    ports:
      - "${EBT_HTTP_PORT:-80}:80"
      - "${EBT_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./clients/flutter/build/web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

  dbf-import:
    build:
      context: .
      target: dbf-import
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Ebt: Host=db;Database=ebt;Username=ebt;Password=${EBT_DB_PASSWORD:?set EBT_DB_PASSWORD in .env}
    volumes:
      - ${EBT_DBF_DIR:-./legacy}:/legacy:ro
    command: ["--dir", "/legacy", "--migrate"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
